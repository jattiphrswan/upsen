                <b>Carrier:</b> ${countryData.Carrier}<br>
                <b>Subscription:</b> ${countryData.Subs}<br><br>
                <b>Carrier:</b> ${countryData.Carrier2 || "N/A"}<br>
                <b>Subscription:</b> ${countryData.Subs2 || "N/A"}<br><br>
                <b>Carrier:</b> ${countryData.Carrier3 || "N/A"}<br>
                <b>Subscription:</b> ${countryData.Subs3 || "N/A"}<br>
            </div>
        `;

            const infoWindow = new google.maps.InfoWindow({ content: contentString });

            marker.addListener('mouseover', () => infoWindow.open(map, marker));
            marker.addListener('mouseout', () => infoWindow.close());

            markers.push(marker);
        }

        continentSelect.addEventListener('change', function () {
            const selectedContinent = this.value;
            previousContinent = selectedContinent;  // Track selected continent
            const countries = countriesByContinent[selectedContinent] || [];

            countryListContainer.innerHTML = '';
            countryListContainer.classList.remove('hidden');

            clearMarkers();

            if (countries.length > 0) {
                const bounds = new google.maps.LatLngBounds();

                countries.forEach(country => {
                    const coords = countryCoordinates[country];
                    if (coords) {
                        addMarker(coords, country);
                        bounds.extend(new google.maps.LatLng(coords.lat, coords.lng));

                        const listItem = document.createElement('div');
                        listItem.textContent = country;
                        listItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer';
                        listItem.addEventListener('click', () => {
                            map.setCenter(coords);
                            map.setZoom(4);
                            clearMarkers();
                            addMarker(coords, country);
                            countryListContainer.classList.add('hidden');
                            showBackButton();  // Show the back button when a country is clicked
                        });
                        countryListContainer.appendChild(listItem);
                    }
                });

                // Fit the bounds to the markers
                map.fitBounds(bounds);
            }
        });

        function showBackButton() {
            const backButton = document.getElementById('back-btn');
            backButton.classList.remove('hidden');
            backButton.addEventListener('click', function () {
                showAllCountries(previousContinent);  // Show all countries of the selected continent
                backButton.classList.add('hidden');  // Hide the back button
            });
        }

        function showAllCountries(continent) {
            const countries = countriesByContinent[continent];
            clearMarkers();
            const bounds = new google.maps.LatLngBounds();

            countries.forEach(country => {
                const coords = countryCoordinates[country]; // Assuming you have this mapping
                if (coords) {
                    addMarker(coords, country);
                    bounds.extend(new google.maps.LatLng(coords.lat, coords.lng));
                }
            });

            map.fitBounds(bounds);
            countryListContainer.classList.remove('hidden');  // Show country list again
        }

        allCountriesBtn.addEventListener('click', function () {
            countryListContainer.classList.toggle('hidden');
            const selectedContinent = continentSelect.value;
            const countries = countriesByContinent[selectedContinent] || [];
            countryListContainer.innerHTML = ''; // Clear previous list

            if (countries.length > 0) {
                countries.forEach(country => {
                    const listItem = document.createElement('div');
                    listItem.textContent = country;
                    listItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer';
                    listItem.addEventListener('click', () => {
                        const coordinates = countryCoordinates[country];
                        if (coordinates) {
                            map.setCenter(coordinates);
                            map.setZoom(5); // Adjust zoom level as needed
                            clearMarkers();
                            addMarker(coordinates, country);
                            countryListContainer.classList.add('hidden'); // Hide list after selection
                            showBackButton();  // Show the back button when a country is clicked
                        } else {
                            console.warn(`Coordinates not found for ${country}`);
                        }
                    });
                    countryListContainer.appendChild(listItem);
                });
                countryListContainer.classList.remove('hidden');
            } else {
                countryListContainer.classList.add('hidden');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            const menuIcon = document.getElementById('menu-icon');
            const closeIcon = document.getElementById('close-icon');

            if (menuBtn) {
                menuBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                    menuIcon.classList.toggle('hidden');
                    closeIcon.classList.toggle('hidden');
                });
            }
        });
    </script>
</body>

</html>
