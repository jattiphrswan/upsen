<div class="form-row">
  <div class="form-column-full">
    <label class="form-label">Full Name 
      [text* full-name class:form-input full-name]
    </label>
  </div>
</div>

<div class="form-row">
  <div class="form-column">
    <label class="form-label">Phone Number 
      [tel* phone class:form-input phone]
    </label>
  </div>
  <div class="form-column">
    <label class="form-label">Email Address 
      [email* email class:form-input email]
    </label>
  </div>
</div>

<div class="form-row">
  <div class="form-column-full">
    <label class="form-label">Address 
      [text address class:form-input address]
    </label>
  </div>
</div>

<div class="form-row">
  <div class="form-column-full">
    <label class="form-label">Additional Requests
      [textarea requests class:form-textarea requests]
    </label>
  </div>
</div>

<div class="form-row">
  <div class="form-column-full">
    [submit class:form-submit "Submit"]
  </div>
</div>
