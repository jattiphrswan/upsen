        let map;
        let currentMarker = null;

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 20.0, lng: 0.0 },
                zoom: 2,
            });

            // Handle country click
            document.getElementById("allCountriesBtn").addEventListener("click", function () {
                const countryList = Object.keys(countryCoordinates);
                const ul = document.getElementById("countryList");
                ul.innerHTML = "";
                countryList.forEach(country => {
                    const li = document.createElement("li");
                    li.textContent = country;
                    li.className = "cursor-pointer hover:bg-gray-200 px-3 py-2 rounded";
                    li.addEventListener("click", () => {
                        showCountryMarker(country);
                    });
                    ul.appendChild(li);
                });
            });
        }

        function showCountryMarker(country) {
            const coords = countryCoordinates[country];
            if (!coords) return;

            // Clear previous marker
            if (currentMarker) {
                currentMarker.setMap(null);
            }

            // Custom icon
            const customIcon = {
                url: "your-icon-path.png", // <-- replace with actual path or URL
                scaledSize: new google.maps.Size(40, 40),
                anchor: new google.maps.Point(20, 40)
            };

            currentMarker = new google.maps.Marker({
                position: coords,
                map: map,
                icon: "./assets/map_markerss.png",
                title: country,
            });

            const infoWindow = new google.maps.InfoWindow({
                content: `<strong>${country} </strong>`,
            });

            currentMarker.addListener("click", () => {
                infoWindow.open(map, currentMarker);
            });

            map.setZoom(5);
            map.setCenter(coords);
        }

        window.onload = initMap;



        function addMultipleMarkers(locations) {
            clearMarkers();
            var bounds = new google.maps.LatLngBounds();

            locations.forEach((location) => {
                var marker = new google.maps.Marker({
                    position: { lat: location.lat, lng: location.lng },
                    map: map,
                    title: location.title,
                    icon: "./assets/map_markerss.png",


                });

                markers.push(marker);
                // bounds.extend(marker.getPosition());
                bounds.extend(new google.maps.LatLng(location.lat, location.lng));
            });

            if (locations.length === 1) {
                // Single location: center and zoom in manually
                map.setCenter(locations[0]);
                map.setZoom(6); // You can adjust this zoom level as needed
            } else {
                // Multiple markers: fit bounds
                map.fitBounds(bounds);
            }
        }







        // Append to the parent div of the button
        allCountriesBtn.parentNode.appendChild(countryOverlay);

        allCountriesBtn.addEventListener('click', () => {
            const selectedContinent = continentSelect.value;
            const countries = countriesByContinent[selectedContinent] || [];

            // Populate the overlay
            countryOverlay.innerHTML = countries.map(c =>
                `<li class="my-1">
                            <button class="underline text-blue-500 hover:text-white hover:bg-blue-500 transition-all w-full text-left px-2 py-1 rounded country-item" data-country="${c}">
                                ${c}
                            </button>
                            </li>`
            ).join('');

            // Toggle visibility
            countryOverlay.style.display = countryOverlay.style.display === 'none' ? 'block' : 'none';
        });
        // Event listener for country click
        countryOverlay.addEventListener('click', (e) => {
            if (e.target.classList.contains('country-item')) {
                const countryName = e.target.dataset.country;
                const coords = countryCoordinates[countryName];

                // 👉 Hide the overlay first
                countryOverlay.remove(); // or you can use `countryOverlay.style.display = 'none';` to just hide it

                // 👉 Then zoom to the country
                if (coords && map) {
                    map.setCenter(coords);
                    map.setZoom(5);
                } else {
                    alert(`No map data found for ${countryName}`);
                }
            }
        });

        // Recreate the countryOverlay after zooming into a country
        allCountriesBtn.addEventListener('click', () => {
            // If the country overlay doesn't exist, recreate it
            if (!document.getElementById('countryList')) {
                document.querySelector('.z-50.flex').appendChild(countryOverlay);
            }

            const selectedContinent = continentSelect.value;
            const countries = countriesByContinent[selectedContinent] || [];
            countryOverlay.innerHTML = countries.map(c =>
                `<li><button class="underline text-blue-400 hover:text-white country-item" data-country="${c}">${c}</button></li>`
            ).join('');
        });



    </script>
